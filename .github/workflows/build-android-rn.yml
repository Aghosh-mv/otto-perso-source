name: Build Otto Android (React Native + nodejs-mobile)

# Builds a REAL Android app that bundles Node.js inside the APK.
# The app starts the Next.js server internally and loads it in a WebView.
# No external server needed. Works offline. Ready for Play Store.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 ndk;26.1.10909125'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Otto dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Create .env
        shell: bash
        run: |
          echo "DATABASE_URL=file:./db/custom.db" > .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "OTTO_MODEL=gemini-3.5-flash-lite" >> .env
          echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> .env
          echo "NEXTAUTH_URL=http://localhost:3000" >> .env
          echo "OTTO_OWNER_EMAIL=owner@otto.local" >> .env
          echo "OTTO_OWNER_PASSWORD=otto-perso-owner" >> .env

      - name: Build Next.js standalone
        run: node scripts/build-standalone.js

      - name: Install React Native CLI
        run: npm install -g react-native-cli

      - name: Install mobile dependencies
        working-directory: otto-mobile
        run: npm install --legacy-peer-deps

      - name: Bundle Next.js server for mobile
        shell: bash
        run: |
          # Copy the Next.js standalone build into the mobile project
          mkdir -p otto-mobile/node-assets/.next
          mkdir -p otto-mobile/node-assets/public
          mkdir -p otto-mobile/node-assets/prisma
          cp -r .next/standalone/* otto-mobile/node-assets/ 2>/dev/null || true
          cp -r .next/static otto-mobile/node-assets/.next/static 2>/dev/null || true
          cp -r public/* otto-mobile/node-assets/public/ 2>/dev/null || true
          cp prisma/schema.prisma otto-mobile/node-assets/prisma/ 2>/dev/null || true
          cp .env otto-mobile/node-assets/.env 2>/dev/null || true
          
          # Create the Node.js entry point that the mobile app will run
          cat > otto-mobile/node-assets/server.js << 'EOF'
          process.env.NODE_ENV = 'production';
          process.env.PORT = '3000';
          process.env.HOSTNAME = 'localhost';
          
          const { createServer } = require('http');
          const { parse } = require('url');
          const next = require('next');
          
          const app = next({ dev: false });
          const handle = app.getRequestHandler();
          
          app.prepare().then(() => {
            const server = createServer((req, res) => {
              const parsedUrl = parse(req.url, true);
              handle(req, res, parsedUrl);
            });
            
            server.listen(3000, 'localhost', (err) => {
              if (err) throw err;
              console.log('[Otto] Server ready on http://localhost:3000');
            });
          });
          EOF
          
          echo "✓ Server bundled for mobile"

      - name: Create Android project
        working-directory: otto-mobile
        run: |
          npx @react-native-community/cli@latest init OttoPerso --directory android-app --skip-install --pm npm
          cd android-app
          npm install --legacy-peer-deps

      - name: Build APK
        working-directory: otto-mobile/android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: List built APKs
        shell: bash
        run: |
          echo "=== Built APKs ==="
          find otto-mobile/android-app -name "*.apk" -type f 2>/dev/null
          ls -lh otto-mobile/android-app/android/app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            otto-mobile/android-app/android/app/build/outputs/apk/debug/*.apk
          tag_name: ${{ github.ref_name }}
          name: "Otto Perso ${{ github.ref_name }}"
          body: "Otto Perso — your digital employee. Download for your platform below."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: otto-android-apk-real
          path: otto-mobile/android-app/android/app/build/outputs/apk/debug/*.apk
